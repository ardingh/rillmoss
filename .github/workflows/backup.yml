name: Monthly complete rule backup
on:
  schedule:
    - cron: '18 9 15 * *'
      timezone: Asia/Taipei
  workflow_run:
    workflows: ['Daily source check and update']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rillmoss-monthly-backup
  cancel-in-progress: false
jobs:
  backup:
    if: github.repository == 'ardingh/rillmoss' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Read trusted main, never workflow_run artifacts or an untrusted head SHA.
      # An upstream failure still archives the last complete published bundle.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Verify and retain this month's complete published version
        run: python -B -m rillmoss.backup
